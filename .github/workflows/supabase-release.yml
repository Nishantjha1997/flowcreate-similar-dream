name: Supabase release

on:
  workflow_dispatch:

jobs:
  deploy:
    # This is deliberately manual: applying production migrations is a
    # controlled release step and requires the owner to configure the two
    # database credentials first.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ufzxrojekrrvlweadnkq

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy changed Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for function in \
            admin-provider-secrets \
            test-ai-provider \
            gemini-suggest \
            blog-ai \
            create-razorpay-order \
            verify-razorpay-payment \
            create-razorpay-subscription \
            verify-razorpay-subscription \
            cancel-razorpay-subscription \
            razorpay-webhook \
            blog-scheduler; do
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done

      - name: Verify live release
        run: node scripts/verify-live-release.mjs
